version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: sharp-crm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: sharp_crm
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sharp-crm-net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: sharp-crm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - sharp-crm-net

  # Spring Boot 后端
  backend:
    # 构建上下文回到仓库根目录，Dockerfile 位于 ops/ 下
    build:
      context: ..
      dockerfile: ops/Dockerfile
    container_name: sharp-crm-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SIGNATURE: ${JWT_SIGNATURE:-sharp-crm-secret}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sharp-crm-net

  # Nginx 前端（含反向代理）
  nginx:
    image: nginx:1.24-alpine
    container_name: sharp-crm-nginx
    ports:
      - "90:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sharp-crm-net

volumes:
  mysql-data:
  redis-data:

networks:
  sharp-crm-net:
    driver: bridge
